# SPDX-License-Identifier: Apache-2.0
# Every gate from docs/BUILD_PROMPT.md. Runs on every pull request with no credentials present.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    name: Types, lint, unit, config, licenses, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: SPDX headers
        run: pnpm check:spdx
      - name: Licenses
        run: pnpm check:licenses
      - name: Unit tests, coverage, config validation, determinism, adapter contract
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Docs site and links
        run: |
          pnpm docs:build
          pnpm docs:build --check
      - name: Generated JSON Schema is committed
        run: git diff --exit-code -- packages/core/schema
      - name: Bundle size
        run: pnpm check:size

  package:
    name: Package, smoke test, container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm package
      - name: Start packaged server and check health, snapshot, and web (CSP)
        run: node scripts/verify-package.mjs
      - name: Build container image
        run: docker build -f deploy/docker/Dockerfile -t orrery:ci .

  e2e:
    name: Visual regression and accessibility
    # Same image and architecture as scripts/visual-baselines.sh, so screenshots match exactly.
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble-arm64
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secrets and names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml
      - name: Denylist
        run: node scripts/check-denylist.mjs
