<!-- Orloj niche icons. 64-unit grid, stroke-based, colored by currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <symbol id="orloj-spend" viewBox="0 0 64 64">
    <title>Spend rate</title>
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 48v5c0 3 6 5 14 5s14-2 14-5v-5"/><ellipse cx="20" cy="48" rx="14" ry="5"/>
      <path d="M6 40v5c0 3 6 5 14 5s14-2 14-5v-5"/><ellipse cx="20" cy="40" rx="14" ry="5"/>
      <path d="M6 32v5c0 3 6 5 14 5s14-2 14-5v-5"/><ellipse cx="20" cy="32" rx="14" ry="5"/>
      <circle cx="46" cy="38" r="13"/><circle cx="46" cy="38" r="8.5" stroke-width="2"/>
      <path d="M46 32v12M42.5 35.5h5a2.5 2.5 0 0 1 0 5h-5" stroke-width="2"/>
    </g>
  </symbol>
  <symbol id="orloj-freshness" viewBox="0 0 64 64">
    <title>Freshness</title>
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 6h32M16 58h32"/>
      <path d="M21 6c0 15 22 17 22 26s-22 11-22 26M43 6c0 15-22 17-22 26s22 11 22 26"/>
      <path d="M26 15h12c-1 5-3.5 8-6 10.5c-2.5-2.5-5-5.5-6-10.5z" fill="currentColor" stroke="none"/>
      <path d="M24 55c2-6 5-9 8-9s6 3 8 9z" fill="currentColor" stroke="none"/>
      <path d="M32 27v18" stroke-width="1.6"/>
    </g>
  </symbol>
  <symbol id="orloj-incidents" viewBox="0 0 64 64">
    <title>Incidents</title>
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 7c-2 0-3.5 1.5-3.5 3.5v1.8C20.5 14.2 16 21 16 29v10l-5 7h42l-5-7V29c0-8-4.5-14.8-12.5-16.7v-1.8C35.5 8.5 34 7 32 7z"/>
      <path d="M26 50a6 6 0 0 0 12 0"/>
      <path class="ringing" d="M7 20c-3 5-3 12 0 17M57 20c3 5 3 12 0 17" stroke-width="2.4"/>
    </g>
  </symbol>
  <symbol id="orloj-consumers" viewBox="0 0 64 64">
    <title>Consumer activity</title>
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 32c6-11 15.5-17 27-17s21 6 27 17c-6 11-15.5 17-27 17S11 43 5 32z"/>
      <circle cx="32" cy="32" r="10"/><circle cx="32" cy="32" r="4.5" fill="currentColor" stroke="none"/>
      <path class="active" d="M32 9V4M18 12l-3-4M46 12l3-4" stroke-width="2.2"/>
    </g>
  </symbol>
</svg>
