apiVersion: v1
kind: Service
metadata:
  name: {{ include "orrery.fullname" . }}
  labels:
    {{- include "orrery.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "orrery.selectorLabels" . | nindent 4 }}
